<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Appointments</title>
<style>
:root{--bg:#f4f8f8;--card:#fff;--ink:#14282b;--mute:#587073;--line:#d6e2e3;--acc:#0b7a75;--bad:#b3261e;--sel:#d9f1ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1b;--card:#172426;--ink:#e4efef;--mute:#91aaac;--line:#28403f;--acc:#4fc9c0;--bad:#ff8a80;--sel:#1c3b3a}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
main{max-width:860px;margin:24px auto;padding:0 16px}h1{font-size:1.2rem;margin:0}h2{font-size:1.15rem;margin:18px 0 8px}h3{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:9px;margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:9px 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}button.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.grow{flex:1;min-width:140px}
.mute{color:var(--mute);font-size:.9rem}.err{color:var(--bad);min-height:1.4em}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--line)}
.booked{color:var(--acc);border-color:var(--acc)}.cancelled{color:var(--bad);border-color:var(--bad)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.slots button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.slots button.on{background:var(--sel);border-color:var(--acc)}.auth{max-width:400px;margin:60px auto}
</style></head><body>
<header><h1>Hospital Appointments</h1><div id="who"></div></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
let session = JSON.parse(localStorage.getItem("session") || "null");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const hr = h => `${String(h).padStart(2,"0")}:00`;

async function api(path, opts = {}) {
  opts.headers = {...(session ? {Authorization: "Bearer " + session.token} : {})};
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers["Content-Type"] = "application/json"; opts.method = opts.method || "POST"; }
  const r = await fetch("/api" + path, opts);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && session) logout();
  if (!r.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}
function logout() { session = null; localStorage.removeItem("session"); render(); }
function setSession(d) { session = d; localStorage.setItem("session", JSON.stringify(d)); render(); }
function render() {
  $("#who").innerHTML = session ? `${esc(session.name)} <span class="tag">${session.role}</span> <button class="ghost" onclick="logout()">Sign out</button>` : "";
  if (!session) return renderAuth();
  session.role === "doctor" ? renderDoctor() : renderPatient();
}

function renderAuth() {
  let reg = false;
  $("#app").innerHTML = `<div class="card auth"><h2 id="t"></h2>
  <div id="regOnly"><label>Full name<input id="name" autocomplete="name"></label>
  <label>I am a<select id="role"><option value="patient">Patient</option><option value="doctor">Doctor</option></select></label>
  <label id="spl">Specialization<input id="spec" placeholder="e.g. Cardiology"></label></div>
  <label>Email<input id="email" type="email" autocomplete="email"></label>
  <label>Password<input id="pw" type="password"></label>
  <div class="err" id="err"></div><button id="go"></button> <button class="ghost" id="sw"></button></div>`;
  const sync = () => {
    $("#t").textContent = reg ? "Create an account" : "Sign in";
    $("#go").textContent = reg ? "Create account" : "Sign in";
    $("#sw").textContent = reg ? "I already have an account" : "Create an account";
    $("#regOnly").style.display = reg ? "" : "none";
    $("#spl").style.display = $("#role").value === "doctor" ? "" : "none";
  };
  $("#role").onchange = sync; $("#sw").onclick = () => { reg = !reg; sync(); };
  $("#go").onclick = async () => {
    $("#err").textContent = "";
    try {
      const body = {email: $("#email").value, password: $("#pw").value};
      if (reg) Object.assign(body, {name: $("#name").value, role: $("#role").value, specialization: $("#spec").value});
      setSession(await api(reg ? "/register" : "/login", {json: body}));
    } catch (e) { $("#err").textContent = e.message; }
  };
  sync();
}

/* ---------- Patient ---------- */
let pick = {};
async function renderPatient() {
  const [docs, appts] = await Promise.all([api("/doctors?q=" + encodeURIComponent($("#q")?.value || "")), api("/appointments")]);
  const q = $("#q")?.value || "";
  $("#app").innerHTML = `<h2>Find a doctor</h2><input id="q" placeholder="Search by name or specialization" value="${esc(q)}">` +
    (docs.length ? docs.map(d => `<div class="card"><div class="row"><div><h3>${esc(d.name)}</h3>
      <span class="mute">${esc(d.specialization)} | ${hr(d.start_hour)} to ${hr(d.end_hour)}</span></div>
      <button onclick="openBook(${d.id})">Book appointment</button></div><div id="b${d.id}"></div></div>`).join("")
      : `<p class="mute">No doctors match. Doctors appear here after they register.</p>`) +
    `<h2>Your appointments</h2>` + (appts.length ? appts.map(a => `<div class="card"><div class="row"><div>
      <h3>${esc(a.doctor)}</h3><span class="mute">${esc(a.specialization)} | ${a.date} at ${a.time}</span>
      ${a.reason ? `<div>${esc(a.reason)}</div>` : ""}${a.notes ? `<div class="mute">Doctor's notes: ${esc(a.notes)}</div>` : ""}</div>
      <div><span class="tag ${a.status}">${a.status}</span> ${a.status === "booked" ? `<button class="bad" onclick="cancelA(${a.id})">Cancel</button>` : ""}</div></div></div>`).join("")
      : `<p class="mute">You have no appointments yet.</p>`);
  $("#q").oninput = debounce(renderPatient);
  if (q) $("#q").focus();
}
function debounce(f) { let t; return () => { clearTimeout(t); t = setTimeout(f, 300); }; }
function openBook(id) {
  pick = {doctor_id: id, date: today(), time: null};
  $("#b" + id).innerHTML = `<label>Date<input type="date" id="dt${id}" min="${today()}" value="${today()}"></label>
    <div class="slots" id="sl${id}"></div><label>Reason for visit<input id="rs${id}"></label>
    <div class="err" id="er${id}"></div><button id="cf${id}" disabled onclick="confirmBook(${id})">Confirm booking</button>`;
  $("#dt" + id).onchange = e => { pick.date = e.target.value; pick.time = null; loadSlots(id); };
  loadSlots(id);
}
async function loadSlots(id) {
  const box = $("#sl" + id); $("#cf" + id).disabled = true;
  try {
    const s = await api(`/doctors/${id}/slots?date=${pick.date}`);
    box.innerHTML = s.map(x => `<button ${x.free ? "" : "disabled"} data-t="${x.time}">${x.time}</button>`).join("") || `<span class="mute">No slots.</span>`;
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      pick.time = b.dataset.t; box.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); $("#cf" + id).disabled = false; });
  } catch (e) { box.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function confirmBook(id) {
  try { await api("/appointments", {json: {...pick, reason: $("#rs" + id).value}}); renderPatient(); }
  catch (e) { $("#er" + id).textContent = e.message; loadSlots(id); }
}
async function cancelA(id) { if (confirm("Cancel this appointment?")) { await api(`/appointments/${id}/cancel`, {method: "POST"}); render(); } }

/* ---------- Doctor ---------- */
async function renderDoctor() {
  const appts = await api("/appointments");
  const docs = await api("/doctors"); const me = docs.find(d => d.name === session.name) || {start_hour: 9, end_hour: 17};
  $("#app").innerHTML = `<div class="card"><h2 style="margin-top:0">Working hours</h2><div class="row">
    <label class="grow">From (hour)<input id="sh" type="number" min="0" max="23" value="${me.start_hour}"></label>
    <label class="grow">To (hour)<input id="eh" type="number" min="1" max="24" value="${me.end_hour}"></label>
    <button onclick="saveHours()">Save hours</button></div><div class="err" id="err"></div></div>
    <h2>Appointments</h2>` + (appts.length ? appts.map(a => `<div class="card"><div class="row"><div>
      <h3>${esc(a.patient)}</h3><span class="mute">${a.date} at ${a.time}</span>${a.reason ? `<div>${esc(a.reason)}</div>` : ""}
      ${a.notes ? `<div class="mute">Notes: ${esc(a.notes)}</div>` : ""}</div><span class="tag ${a.status}">${a.status}</span></div>
      ${a.status === "booked" ? `<input id="n${a.id}" placeholder="Visit notes (optional)"><button onclick="completeA(${a.id})">Mark completed</button> <button class="bad" onclick="cancelA(${a.id})">Cancel</button>` : ""}</div>`).join("")
      : `<p class="mute">No appointments yet. Patients will book into the hours you set above.</p>`);
}
async function saveHours() {
  try { await api("/hours", {method: "PUT", json: {start_hour: $("#sh").value, end_hour: $("#eh").value}}); $("#err").textContent = ""; renderDoctor(); }
  catch (e) { $("#err").textContent = e.message; }
}
async function completeA(id) { await api(`/appointments/${id}/complete`, {json: {notes: $("#n" + id).value}}); renderDoctor(); }
render();
</script></body></html>
